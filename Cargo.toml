[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/ipsec",
    "crates/netlinux",
    "crates/netwin",
    "crates/netproxy",
    "crates/service",
    "crates/cli",
    "crates/gui",
    "tools/mock-gw",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jerhome/fortivpn-rs"
publish = false

[workspace.dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
bytes = "1.12"
cbc = "0.1"
des = "0.8"
futures-util = { version = "0.3.31", default-features = false }
hmac = "0.12"
httparse = "1.10"
ipnet = "2.12"
md4 = "0.10"
nix = { version = "0.31", default-features = false }
num-bigint = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
quick-xml = "0.42"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rtnetlink = "0.24"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
secrecy = "0.10"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.54", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tun = "0.15"
tracing = "0.1.44"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Bruyants / peu utiles pour ce projet :
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Hygiène supplémentaire :
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
inherits = "dev"
