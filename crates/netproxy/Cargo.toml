[package]
name = "netproxy"
description = "NetBackend en espace utilisateur (sans admin) : pile smoltcp + proxy SOCKS5 + redirections de ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Copie de `[workspace.lints]` sauf `unsafe_code` (« deny » au lieu de « forbid ») : le seul `unsafe`
# sont `setsockopt(SO_EXCLUSIVEADDRUSE)` (`listen.rs`) et le contrôle du propriétaire (`owner.rs`),
# cfg(windows), avec `#[allow]` local.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
bytes.workspace = true
fortivpn-core = { path = "../core" }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-dns"] }
socket2 = "0.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "rt", "macros"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
ipnet.workspace = true
# E2E (tests/e2e_mockgw.rs) : fausse passerelle TLS + PPP.
mock-gw = { path = "../../tools/mock-gw" }
# Pair « passerelle » simulé (écho TCP + DNS UDP) des tests d'intégration.
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp"] }
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
