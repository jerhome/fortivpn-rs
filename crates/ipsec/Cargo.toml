[package]
name = "ipsec"
description = "Transport IPsec (IKE + ESP espace utilisateur)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Expose le répondeur IKE/ESP simulé (`testutil`) aux tests d'intégration.
test-util = []

[dependencies]
aes = { workspace = true, features = ["zeroize"] }
aes-gcm = { workspace = true, features = ["zeroize"] }
bytes.workspace = true
cbc.workspace = true
des.workspace = true
fortivpn-core = { path = "../core" }
hmac.workspace = true
ipnet.workspace = true
md4.workspace = true
num-bigint.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
pkcs1.workspace = true
ring.workspace = true
rsa.workspace = true
secrecy.workspace = true
sha1 = { workspace = true, features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros"] }
tracing.workspace = true
x509-cert.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Active `test-util` (répondeur simulé) et le FakeNetBackend de core pour tests/e2e_udp.rs.
fortivpn-core = { path = "../core", features = ["test-util"] }
ipsec = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "rt-multi-thread", "macros"] }
