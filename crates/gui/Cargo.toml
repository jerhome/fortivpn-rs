[package]
name = "gui"
description = "Interface graphique Slint : fortivpn-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "fortivpn_gui"
path = "src/lib.rs"

[[bin]]
name = "fortivpn-gui"
path = "src/main.rs"

# Copie de `[workspace.lints]` sauf `unsafe_code` : le code généré par les macros de
# Slint contient du `unsafe` (le code de ce crate n'en contient aucun : voir `lib.rs`).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fortivpn-app = { package = "cli", path = "../cli" }
fortivpn-core = { path = "../core" }
fortivpn-service = { path = "../service" }
netproxy = { path = "../netproxy" }
secrecy.workspace = true
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
zeroize.workspace = true

[build-dependencies]
slint-build = "=1.13.1"

[dev-dependencies]
fortivpn-core = { path = "../core", features = ["test-util"] }
i-slint-backend-testing = "=1.13.1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }

# Zone de notification et notifications système : Windows seulement (sous Linux,
# tray-icon exige GTK/libappindicator, absents ; la logique pure reste testée partout).
[target.'cfg(windows)'.dependencies]
notify-rust = { version = "4", default-features = false }
tray-icon = { version = "0.24", default-features = false }

# Icône SNI (D-Bus pur Rust, sans GTK ni libdbus) et notifications zbus : Linux seulement.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"], optional = true }
notify-rust = { version = "4", default-features = false, features = ["z"], optional = true }

[features]
default = ["linux-tray"]
# Sans effet hors Linux.
linux-tray = ["dep:ksni", "dep:notify-rust"]
